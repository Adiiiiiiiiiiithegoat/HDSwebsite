<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F172A" />

    <!-- SVG first for browsers that take it; .ico carries 16/32/48 for those
         that don't. The 192 PNG is here for Google — its favicon crawler wants
         a square at a multiple of 48px, and it reads rel="icon", not the
         manifest. All generated from one geometry, see public/favicon.svg. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Everything between these two markers is per-route: scripts/prerender.mjs
         replaces the whole block with the values from src/seo.js when it writes
         each route's static HTML. The homepage's values live here so `vite dev`
         (which never runs the prerender) still has a sane head. Canonical is
         needed because the site also answers on solutionhaven.pages.dev. -->
    <!--head:start-->
    <title>Solution Haven — workflow automation &amp; custom software</title>
    <meta
      name="description"
      content="We find where your operations break — manual work, disconnected tools, slow approvals — then fix it with automation, integration or custom software."
    />
    <link rel="canonical" href="https://solutionhaven.net/" />
    <meta property="og:title" content="Solution Haven — workflow automation &amp; custom software" />
    <meta
      property="og:description"
      content="We solve business problems using AI, automation and custom software — not the other way around. See how we work before you commit to anything."
    />
    <meta property="og:url" content="https://solutionhaven.net/" />
    <meta
      name="twitter:title"
      content="Solution Haven — workflow automation &amp; custom software"
    />
    <meta
      name="twitter:description"
      content="We solve business problems using AI, automation and custom software — not the other way around."
    />
    <!--head:end-->

    <!-- Open Graph — someone will paste this into a WhatsApp group or Slack. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Solution Haven" />
    <!-- Absolute URL required: several OG/Twitter card crawlers (WhatsApp
         included) don't reliably resolve a root-relative image URL against
         the page URL. -->
    <meta property="og:image" content="https://solutionhaven.net/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://solutionhaven.net/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- Site-wide entity. Per-route BreadcrumbList and FAQPage blocks are added
         by scripts/prerender.mjs inside the head:start/head:end block above.

         alternateName carries the name people actually type — "Haven
         Solutions" (transposed) and "SolutionHaven" (no space). It tells
         search and answer engines those strings refer to this entity; it does
         not win the query on its own, see the note in README.

         TODO: "sameAs" is the single highest-value field left empty here. Add
         the LinkedIn company page, Google Business Profile, Crunchbase and any
         directory listing as they go live — corroborating a business across
         independent sources is most of what makes an answer engine willing to
         name it. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["Organization", "ProfessionalService"],
        "@id": "https://solutionhaven.net/#organization",
        "name": "Solution Haven",
        "alternateName": ["Haven Solutions", "SolutionHaven", "Solution Haven AI"],
        "url": "https://solutionhaven.net/",
        "logo": "https://solutionhaven.net/icon-512.png",
        "image": "https://solutionhaven.net/og.png",
        "email": ["aditya@solutionhaven.net", "siddhartha@solutionhaven.net"],
        "telephone": "+91 88797 60718",
        "description": "Solution Haven helps businesses eliminate operational bottlenecks using AI, automation, existing software, custom software and integrations.",
        "slogan": "We solve business problems. Technology is only the tool.",
        "knowsAbout": [
          "Business process automation",
          "Workflow automation",
          "AI automation for small and mid-sized businesses",
          "Custom software development",
          "Systems integration",
          "GST return automation for chartered accountancy firms",
          "Operations software for Solar EPC companies"
        ],
        "areaServed": { "@type": "Country", "name": "India" },
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "sales",
          "email": ["aditya@solutionhaven.net", "siddhartha@solutionhaven.net"],
          "telephone": "+91 88797 60718",
          "areaServed": "IN",
          "availableLanguage": ["en", "hi"]
        }
      }
    </script>
  </head>
  <body>
    <!-- scripts/prerender.mjs replaces this marker with the whole page, already
         rendered to HTML, so there is nothing blank to paint over while the JS
         downloads and a crawler that doesn't run JS still gets the full text.
         `vite dev` leaves it empty — dev only, and dev has no crawlers. -->
    <div id="root"><!--app--></div>
    <noscript>
      <div class="wrap" style="padding: 96px 0; max-width: 640px">
        <h1>This site needs JavaScript.</h1>
        <p>
          Turn it on and reload, or email us at
          <a href="mailto:aditya@solutionhaven.net">aditya@solutionhaven.net</a> or
          <a href="mailto:siddhartha@solutionhaven.net">siddhartha@solutionhaven.net</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
