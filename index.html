<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F172A" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>Solution Haven — eliminate operational bottlenecks with AI, automation and custom software</title>
    <meta
      name="description"
      content="Solution Haven helps businesses eliminate operational bottlenecks using AI, automation and custom software. We solve business problems — technology is only the tool."
    />

    <!-- Open Graph — someone will paste this into a WhatsApp group or Slack. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Solution Haven" />
    <meta
      property="og:title"
      content="Solution Haven — eliminate operational bottlenecks with AI, automation and custom software"
    />
    <meta
      property="og:description"
      content="We solve business problems using AI, automation and custom software — not the other way around. See how we work before you commit to anything."
    />
    <!-- Canonical: the site also answers on solutionhaven.pages.dev; this is the real one. -->
    <link rel="canonical" href="https://solutionhaven.net/" />
    <meta property="og:url" content="https://solutionhaven.net/" />
    <!-- Absolute URL required: several OG/Twitter card crawlers (WhatsApp
         included) don't reliably resolve a root-relative image URL against
         the page URL. -->
    <meta property="og:image" content="https://solutionhaven.net/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Solution Haven — eliminate operational bottlenecks with AI, automation and custom software"
    />
    <meta
      name="twitter:description"
      content="We solve business problems using AI, automation and custom software — not the other way around."
    />
    <meta name="twitter:image" content="https://solutionhaven.net/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Solution Haven",
        "url": "https://solutionhaven.net/",
        "logo": "https://solutionhaven.net/icon-512.png",
        "email": "hello@solutionhaven.net",
        "description": "Solution Haven helps businesses eliminate operational bottlenecks using AI, automation, existing software, custom software and integrations.",
        "areaServed": "IN"
      }
    </script>
  </head>
